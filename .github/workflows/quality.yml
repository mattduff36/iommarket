name: Quality

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require staging as the production PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$PR_BASE" = "main" ] && [ "$PR_HEAD" != "staging" ]; then
            # Owner-approved, single-PR Franklin release exception (10 October 2026).
            if [ "$PR_NUMBER" != "36" ] || [ "$PR_HEAD" != "codex/franklin-production-release" ] || [ "$PR_HEAD_REPO" != "mattduff36/iommarket" ]; then
              echo "Production pull requests must come from staging."
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium for browser-backed unit tests
        run: npx playwright install --with-deps chromium

      - name: Run deterministic unit tests
        run: npm run test:run

      - name: Verify safe E2E discovery
        run: npm run test:e2e:list
